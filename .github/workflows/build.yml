# Build check — runs on every push and pull request.
#
# This repo deploys with Netlify's Git integration (see netlify.toml), so this
# workflow's job is to verify the site still builds and to keep the built
# output available for download. GitHub Pages is NOT used: its legacy
# Jekyll/"dynamic" pipeline cannot build an Astro project, which is why it used
# to fail on every push.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push supersedes an in-flight run on the same ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: astro build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Summarise the output
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 1 -type f | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
